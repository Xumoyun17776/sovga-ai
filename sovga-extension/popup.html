<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h2 {
      margin: 0;
      font-size: 18px;
    }
    .status {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #78350f;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>✨ Sovg'a AI</h2>
  </div>
  <div class="status">
    Radar faol. Siz xarid qilayotganda biz arzonini izlaymiz.
  </div>
  <a href="https://rest-leasing-widely-substantially.trycloudflare.com" target="_blank" class="btn">
    Asosiy Ilovani Ochish
  </a>
  <p class="desc">Uzum, Texnomart va Olchada avtomatik ishlaydi.</p>
</body>
</html>
