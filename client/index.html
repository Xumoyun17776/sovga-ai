<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>try{if(localStorage.getItem("sovga_theme")==="dark"){document.documentElement.classList.add("dark");document.querySelector('meta[name="theme-color"]').setAttribute("content","#0A1020");}}catch(e){}</script>
    
    <!-- PWA & Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sovga AI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SEO & Social Media -->
    <title>Sovg'a AI — sovg'a toping va narxlarni solishtiring</title>
    <meta name="description" content="Sovg'a AI mos sovg'ani topishga yordam beradi va Uzum, Texnomart, MediaPark kabi do'konlardagi narxlarni solishtiradi. To'y ro'yxatlari, istaklar ro'yxati va narx eslatmalari." />
    <meta property="og:title" content="Sovg'a AI — find the right gift at the right price" />
    <meta property="og:description" content="Gift ideas, price comparison across stores in Uzbekistan, wedding registries and price-drop alerts." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sovgatop.uz/" />
    <meta property="og:site_name" content="Sovg'a" />
    <meta property="og:image" content="https://sovgatop.uz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sovgatop.uz/og.png" />
    <link rel="canonical" href="https://sovgatop.uz/" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Sovg'a","url":"https://sovgatop.uz/","potentialAction":{"@type":"SearchAction","target":"https://sovgatop.uz/search?q={search_term_string}","query-input":"required name=search_term_string"}}</script>
    
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <style>
      body { margin: 0; width: 100%; overflow-x: hidden; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #FFFFFF; z-index: 99999;
        font-family: 'Manrope', sans-serif;
      }
      .loader-logo { width: 44px; height: 44px; margin-bottom: 16px; }
      .loader-text { color: #0E1A36; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      .loader-text span { color: #1F4CA8; }
      .loader-bar { width: 120px; height: 2px; background: rgba(0,0,0,0.08); margin-top: 16px; border-radius: 4px; overflow: hidden; }
      .loader-progress { width: 0%; height: 100%; background: #b7791f; animation: load-bar 1.5s ease-out forwards; }
      @keyframes pulse-glow { 0% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.2)); transform: scale(1); } 50% { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.6)); transform: scale(1.05); } 100% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.2)); transform: scale(1); } }
      .loader-progress { background: #1F4CA8 !important; }
      html.dark, html.dark body { background: #0A1020; }
      html.dark #initial-loader { background: #0A1020; }
      html.dark .loader-text { color: #E9EEF8; }
      html.dark .loader-text span { color: #4A7BE6; }
      html.dark .loader-bar { background: rgba(255,255,255,0.1); }
      @keyframes load-bar { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- Preloader -->
      <div id="initial-loader">
        <div class="loader-text">Sovg'a<span>.</span></div>
        <div class="loader-bar"><div class="loader-progress"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
